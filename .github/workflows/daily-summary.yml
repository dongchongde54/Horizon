name: Weekly Horizon Summary

on:
  schedule:
    # 每周一运行一次。
    # GitHub Actions cron 使用 UTC。
    # 16:00 UTC 约等于美国太平洋夏令时周一 09:00。
    - cron: "0 16 * * 1"

  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      # 因为启用了 OpenBB，所以安装 openbb 可选依赖
      - name: Install dependencies
        run: uv sync --extra openbb

      # Horizon 的 Actions 配置文件是 config.github.json。
      # subscribers.json 被 gitignore，因此运行时从 Secret 生成。
      - name: Prepare configuration
        env:
          SUBSCRIBER_EMAIL: ${{ secrets.SUBSCRIBER_EMAIL }}
        run: |
          cp data/config.github.json data/config.json

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          email = os.environ["SUBSCRIBER_EMAIL"].strip()
          if not email:
              raise RuntimeError("SUBSCRIBER_EMAIL is empty")

          Path("data/subscribers.json").write_text(
              json.dumps([email], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

      - name: Run Horizon
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORIZON_AI_BASE_URL: ${{ secrets.HORIZON_AI_BASE_URL }}

          # GitHub 自动产生的 Token
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # 邮件配置
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}

        # 获取最近 7 天的内容
        run: uv run horizon --hours 168

      - name: Set report date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
          commit_message: "Weekly Horizon Summary ${{ env.DATE }}"
